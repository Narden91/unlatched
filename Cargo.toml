[package]
name = "safe_door_scanner"
version = "0.1.0"
edition = "2021"
description = "Unlatched: local socket inspector for Linux and Windows"
license = "MIT"

[[bin]]
name = "safe_door_scanner"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.33"
netstat2 = "0.11"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
